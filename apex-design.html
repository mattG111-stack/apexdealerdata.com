<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Dealer Data</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d10;
      color: #f5f5f7;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 640px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.1rem;
      color: #a1a1aa;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: #18181b;
      border: 1px solid #27272a;
      font-size: 0.85rem;
      color: #d4d4d8;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Apex Dealer Data</span>
    <h1>We're getting things ready.</h1>
    <p>
      Our full platform is coming online shortly. In the meantime, thanks for
      stopping by &mdash; check back soon.
    </p>
  </div>
</body>
</html>
